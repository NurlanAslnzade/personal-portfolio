      <text x="60.0" y="59.5" font-size="5" font-weight="900" fill="#713F12" text-anchor="middle" font-family="-apple-system, sans-serif" letter-spacing="0.5">NURLAN</text>
    </g>
    

    <!-- Arms spread outward for balance -->
    <path d="M44 50 L28 64" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="27" cy="65" r="4" fill="#FDBA74"/>
    <path d="M76 50 L92 64" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="93" cy="65" r="4" fill="#FDBA74"/>

    
    <g transform="rotate(0 60 32)">
      <!-- Head Skin Base -->
      <circle cx="60" cy="32" r="16" fill="#FDBA74" stroke="#EA580C" stroke-width="1"/>
      <!-- Ear -->
      <circle cx="53" cy="35" r="4" fill="#FDBA74" stroke="#EA580C" stroke-width="1"/>
      <!-- Complete Hair System -->
      
      <!-- Back & Crown Hair Base -->
      <path d="M46 44 C44 38, 44 26, 50 20 C56 14, 70 14, 76 22 C79 26, 79 32, 78 35 C75 35, 73 31, 71 31 C68 31, 67 34, 62 34 C58 34, 57 38, 56 44 C53 44, 51 46, 48 48 C46 48, 46 46, 46 44 Z"
            fill="#3E2312" stroke="#26140A" stroke-width="1.5"/>
      <!-- Hair Volume & Texture Layer -->
