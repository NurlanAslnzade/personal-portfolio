    <path d="M50 82 L38 96 L48 108" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="104" width="14" height="8" rx="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
    <path d="M70 82 L82 96 L72 108" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="104" width="14" height="8" rx="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>

    
      <!-- Navy Shorts -->
      <rect x="46" y="72" width="28" height="18" rx="3" fill="#1E3A8A" stroke="#172554" stroke-width="1.5"/>
      <!-- Center Split & White Trim -->
      <line x1="60.0" y1="78" x2="60.0" y2="90" stroke="#172554" stroke-width="1.5"/>
      <line x1="46" y1="89" x2="74" y2="89" stroke="#FFFFFF" stroke-width="1.5"/>
    
    
    <g transform="rotate(0 60.0 59.0)">
      <!-- Blue Base Jersey -->
