  <ellipse cx="60" cy="120" rx="30" ry="5" fill="none" stroke="#22C55E" stroke-width="2"/>
  <ellipse cx="60" cy="120" rx="24" ry="4" fill="rgba(0,0,0,0.35)"/>

  <!-- Crouched Bent Legs (Impact absorption) -->
