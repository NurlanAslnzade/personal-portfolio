      <path d="M52 28 C57 23, 67 22, 72 27" stroke="#54331C" stroke-width="1.5" fill="none"/>
      <!-- Sideburn -->
      <path d="M57 36 L57 44 L60 41 Z" fill="#3E2312"/>
    
      <!-- Facial Features -->
      
      <!-- Eye -->
      <rect x="65" y="32" width="5" height="5" rx="1.5" fill="#0F172A"/>
      <rect x="66" y="33" width="1.5" height="1.5" fill="#FFFFFF"/>
      <!-- Eyebrow -->
      <path d="M63 29 L72 30" stroke="#26140A" stroke-width="2.5" stroke-linecap="round"/>
    
      <ellipse cx="68" cy="45" rx="3.5" ry="3" fill="#26140A"/>
