
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <line x1="10" y1="120" x2="110" y2="120" stroke="rgba(34,197,94,0.4)" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Small Ground Shadow below jumping player -->
  <ellipse cx="60" cy="120" rx="14" ry="3" fill="rgba(0,0,0,0.15)"/>

  <!-- Elevated Body (y shifted up by 18px) -->
  <g transform="translate(0, -18)">
    <!-- Tucked Bent Knees -->
    <path d="M52 90 L42 102 L50 106" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="102" width="13" height="8" rx="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
    <path d="M66 90 L76 100 L70 106" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="102" width="13" height="8" rx="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>

    
      <!-- Navy Shorts -->
      <rect x="46" y="76" width="28" height="18" rx="3" fill="#1E3A8A" stroke="#172554" stroke-width="1.5"/>
      <!-- Center Split & White Trim -->
      <line x1="60.0" y1="82" x2="60.0" y2="94" stroke="#172554" stroke-width="1.5"/>
      <line x1="46" y1="93" x2="74" y2="93" stroke="#FFFFFF" stroke-width="1.5"/>
    
    
    <g transform="rotate(0 60.0 62.0)">
      <!-- Blue Base Jersey -->
      <rect x="46" y="46" width="28" height="32" rx="4" fill="#1E3A8A" stroke="#172554" stroke-width="1.5"/>
      <!-- Vertical Garnet Stripes -->
      <rect x="51" y="46" width="5" height="32" fill="#991B1B"/>
      <rect x="63" y="46" width="5" height="32" fill="#991B1B"/>
      <!-- Yellow Collar Trim -->
      <path d="M54 46 Q60.0 52 66 46" stroke="#FEF08A" stroke-width="2" fill="none"/>
      <!-- Chest Nameplate: NURLAN -->
      <rect x="48" y="56" width="24" height="7" rx="1.5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.5"/>
      <text x="60.0" y="61.5" font-size="5" font-weight="900" fill="#713F12" text-anchor="middle" font-family="-apple-system, sans-serif" letter-spacing="0.5">NURLAN</text>
    </g>
    

    <!-- Arms Raised Upward for Header Clearance -->
    <path d="M46 52 L36 38" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="35" cy="36" r="4" fill="#FDBA74"/>
    <path d="M74 52 L84 38" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="85" cy="36" r="4" fill="#FDBA74"/>

    
    <g transform="rotate(-4 60 31)">
      <!-- Head Skin Base -->
      <circle cx="60" cy="31" r="16" fill="#FDBA74" stroke="#EA580C" stroke-width="1"/>
      <!-- Ear -->
      <circle cx="53" cy="34" r="4" fill="#FDBA74" stroke="#EA580C" stroke-width="1"/>
      <!-- Complete Hair System -->
      
      <!-- Back & Crown Hair Base -->
      <path d="M46 44 C44 38, 44 26, 50 20 C56 14, 70 14, 76 22 C79 26, 79 32, 78 35 C75 35, 73 31, 71 31 C68 31, 67 34, 62 34 C58 34, 57 38, 56 44 C53 44, 51 46, 48 48 C46 48, 46 46, 46 44 Z"
            fill="#3E2312" stroke="#26140A" stroke-width="1.5"/>
      <!-- Hair Volume & Texture Layer -->
      <path d="M49 24 C54 17, 68 16, 74 23 C71 20, 60 18, 53 23 Z" fill="#54331C"/>
      <path d="M52 28 C57 23, 67 22, 72 27" stroke="#54331C" stroke-width="1.5" fill="none"/>
      <!-- Sideburn -->
      <path d="M57 36 L57 44 L60 41 Z" fill="#3E2312"/>
    
      <!-- Facial Features -->
      
      <!-- Eye -->
      <rect x="65" y="32" width="5" height="5" rx="1.5" fill="#0F172A"/>
      <rect x="66" y="33" width="1.5" height="1.5" fill="#FFFFFF"/>
      <!-- Eyebrow -->
      <path d="M63 29 L72 30" stroke="#26140A" stroke-width="2.5" stroke-linecap="round"/>
    
      <ellipse cx="68" cy="45" rx="3.5" ry="3" fill="#26140A"/>
    </g>
    
  </g>
</svg>
